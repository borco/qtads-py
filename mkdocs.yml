site_name: qtads-py
site_description: PySide6 bindings for Qt Advanced Docking System, built from a patched fork
repo_url: https://github.com/borco/qtads-py
repo_name: borco/qtads-py
edit_uri: edit/main/docs/

extra:
  generator: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Development:
      - Build instructions: build.md
      - Compatibility with pyside6-qtads: compatibility.md
  - PyPI: https://pypi.org/project/pyside6-qtads-borco/

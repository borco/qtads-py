name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: from Ubuntu 26.04 libxml2 no longer
        # ships libxml2.so.2, which shiboken6-generator's prebuilt `shiboken6`
        # binary links against (https://qt-project.atlassian.net/browse/PYSIDE-3504).
        os: [ubuntu-24.04, windows-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Must equal the PySide6 version in uv.lock. On Linux this action
          # puts the SDK's lib/ on LD_LIBRARY_PATH, so PySide6 loads the
          # SDK's Qt instead of its own, and Qt's private API (which PySide6
          # and QtAds' Qt6::GuiPrivate use) is tagged with the exact patch
          # version: a mismatch fails at import with an undefined
          # QtPrivate_6_11_N symbol.
          version: "6.12.0"
          # aqtinstall 3.3.* can't locate Qt 6.11+ on Windows - the online
          # repo dropped the combined qt6_XXXX/qt6_XXXX/Updates.xml in favor
          # of per-arch dirs (miurahr/aqtinstall#959). Use the patched
          # aqtinstall until a release containing PR #1000 lands on PyPI.
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b' || '' }}

      - name: Set Qt env vars
        shell: bash
        run: echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install build/runtime dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          # clang/libclang-dev: shiboken6-generator's bundled libclang can't
          # locate its builtin headers (stddef.h etc.) without an external
          # CLANG_INSTALL_DIR - MSVC's headers don't need this.
          # libxcb1-dev/libxkbcommon-dev: QtAds links xcb on Linux, and its
          # Qt6::GuiPrivate dependency pulls in the xkbcommon headers.
          # libgl1/libegl1/libxkbcommon0: needed for Qt6Gui to load under
          # QT_QPA_PLATFORM=offscreen for the test suite.
          sudo apt-get install -y clang libclang-dev libxcb1-dev libxkbcommon-dev libgl1 libegl1 libxkbcommon0
          RESOURCE_DIR=$(clang -print-resource-dir)
          echo "Clang resource dir: $RESOURCE_DIR"
          echo "CLANG_INSTALL_DIR=$(dirname "$(dirname "$(dirname "$RESOURCE_DIR")")")" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: uv sync
        # --refresh-package: uv's build cache for a local path dependency
        # isn't keyed off the C++ sources, so a plain `uv sync` can silently
        # reuse a stale cached build across cache-restored CI runs.
        run: uv sync --refresh-package pyside6-qtads-borco

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

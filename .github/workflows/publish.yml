name: Publish

# Pushing a `v<version>` tag, e.g. `v5.1.1.0`, publishes that version: the tag
# is the instruction, so a run can never upload something nobody meant to
# release. The version is read from pyproject.toml and must match the tag.
#
# workflow_dispatch is the dry run: it stops at TestPyPI (real PyPI is gated on
# the ref being a tag), exercising build, OIDC and upload without touching
# pypi.org. Both publish jobs use PyPI trusted publishing, configured on
# test.pypi.org and pypi.org for this repo, this workflow file and the
# `testpypi`/`pypi` environments.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the version, and check it against the tag
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version: $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  sdist:
    name: Build sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7

      # The project builds without isolation ([tool.uv] in pyproject.toml),
      # expecting its build requirements in .venv. --no-install-project
      # installs those (plain wheels, no Qt SDK needed for an sdist) without
      # building the project itself.
      - name: Install build dependencies
        run: uv sync --no-install-project

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Build wheels
    needs: version
    uses: ./.github/workflows/wheels.yml

  # Every run publishes here first, a real tag included: TestPyPI is where the
  # trusted-publishing wiring gets exercised before anything reaches pypi.org,
  # where an upload can't be taken back.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyside6-qtads-borco
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A tag run uploads a version the dry run may already have put here.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyside6-qtads-borco
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # No skip-existing: PyPI refusing a version it already has is what
      # catches a tag cut against a spent version number.
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub Release for the tag, its notes taken from CHANGELOG.md.
  github-release:
    name: GitHub Release
    needs: [version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 tools/changelog_section.py CHANGELOG.md "$VERSION" > notes.md
          echo "" >> notes.md
          echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) for full history." >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "pyside6-qtads-borco $VERSION" --notes-file notes.md
